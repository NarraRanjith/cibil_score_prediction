           <!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">

<body class="form-v9">
                    <div class="page-content">
                        <div class="form-v9-content" style="background-image: url('static/assets/img/form-v9.jpg')">
                            <form class="form-detail" action="/predict" method="post">
                                <h2>Please Fill The Information</h2>
                                {% if error %}
                                    <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
                                {% endif %}
                                <div class="form-row-total">
                                    <div class="form-row">
                                        <label for="name"> Name:</label>
                                        <input type="text" name="name" id="name" class="input-text" placeholder="name" required>
                                    </div>
                                    <div class="form-row">
                                        <label for="age"> Age:</label>
                                        <input type="number" name="age" id="age" class="input-text" placeholder="age" required>
                                    </div>
                                </div>
                                <div class="form-row-total">
                                    <div class="form-row">
                                        <label for="occupation"> Occupation:</label>
                                        <input type="text" name="occupation" id="occupation" class="input-text" placeholder="occupation" required>
                                    </div>
                                    <div class="form-row">
                                        <label for="bank"> Bank:</label>
                                        <input type="text" name="bank" id="bank" class="input-text" placeholder="bank" required>
                                    </div>
                                </div>
                                <div class="form-row-total">
                                    <div class="form-row">
                                        <label for="number_of_banks"> Number_of_Banks:</label>
                                        <input type="number" name="number_of_banks" id="number_of_banks" class="input-text" placeholder="number_of_banks" required>
                                    </div>
                                    <div class="form-row">
                                        <label for="number_of_loans"> Number_of_Loans:</label>
                                        <input type="number" name="number_of_loans" id="number_of_loans" class="input-text" placeholder="number_of_loans" required>
                                    </div>
                                </div>
                                <div class="form-row-total">
                                    <div class="form-row">
                                        <label for="due_loans"> Due_Loans:</label>
                                        <input type="number" name="due_loans" id="due_loans" class="input-text" placeholder="due_loans" required>
                                    </div>
                                    <div class="form-row">
                                        <label for="hard_checks"> Hard_Checks:</label>
                                        <input type="number" name="hard_checks" id="hard_checks" class="input-text" placeholder="hard_checks" required>
                                    </div>
                                </div>
                                <div class="form-row-total">
                                    <div class="form-row">
                                        <label for="monthly_income"> monthly_income:</label>
                                        <input type="number" step="any" name="monthly_income" id="monthly_income" class="input-text" placeholder="monthly_income" required>
                                    </div>
                                    <div class="form-row">
                                        <label for="credit_limit"> Credit_Limit:</label>
                                        <input type="number" step="any" name="credit_limit" id="credit_limit" class="input-text" placeholder="credit_limit" required>
                                    </div>
                                </div>
                                <div class="form-row-total">
                                    <div class="form-row">
                                        <label for="credit_usage"> Credit_Usage:</label>
                                        <input type="number" step="any" name="credit_usage" id="credit_usage" class="input-text" placeholder="credit_usage" required>
                                    </div>
                                    <div class="form-row">
                                        <label for="total_limit"> Total_Limit:</label>
                                        <input type="number" step="any" name="total_limit" id="total_limit" class="input-text" placeholder="total_limit" required>
                                    </div>
                                </div>

                                <div class="form-row-total">    
                                    <div class="form-row">
                                        <label for="debt_to_income_ratio"> Debt_to_Income_Ratio:</label>
                                        <input type="number" step="any" name="debt_to_income_ratio" id="debt_to_income_ratio" class="input-text" placeholder="debt_to_income_ratio" required>
                                    </div>
                                    </div>
                                <div class="form-row-last">
                                    <input type="submit" name="register" class="register" value="Predict">
                                </div>
                            </form>
                        </div>
                    </div>
                    
				</div>
			</form>
		</div>
